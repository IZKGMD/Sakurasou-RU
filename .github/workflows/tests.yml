name: Validate toolchain
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image testing dependency
        run: python -m pip install 'Pillow>=10,<13'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate translation template
        run: python tools/check_translations.py translations/strings.csv
